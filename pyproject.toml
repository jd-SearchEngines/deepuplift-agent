[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepuplift"
version = "0.4.0a1"
description = "Open-source uplift modeling and causal decision framework"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "DeepUplift contributors"}]
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "scikit-learn>=1.3,<1.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.32", "matplotlib>=3.7", "seaborn>=0.12"]
polars = ["polars>=0.20"]
econml = ["econml==0.16.0"]
causalml = ["causalml==0.16.0"]
sklift = ["scikit-uplift>=0.5.1"]
lightgbm = ["lightgbm>=4.0"]
torch = ["torch>=1.12", "geomloss>=0.2.6"]
all = [
  "streamlit>=1.32",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "polars>=0.20",
  "econml==0.16.0",
  "causalml==0.16.0",
  "scikit-uplift>=0.5.1",
  "lightgbm>=4.0",
  "torch>=1.12",
  "geomloss>=0.2.6",
]
dev = ["pytest>=8.0", "build>=1.2"]

[tool.setuptools.packages.find]
include = ["deepuplift*"]
