name: quality

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q app.py deepuplift deepuplift_multiple_treatment scripts
      - name: Check shell scripts
        run: bash -n scripts/*.sh
