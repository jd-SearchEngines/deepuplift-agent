name: quality

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core test dependencies
        run: python -m pip install --upgrade pip setuptools wheel build && python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app.py deepuplift deepuplift_multiple_treatment scripts
      - name: Check shell scripts
        run: bash -n scripts/*.sh
      - name: Run core tests and coupon E2E
        run: python -m pytest -q
      - name: Run coupon command smoke
        run: python examples/coupon_allocation/run.py --rows 700 --budget 1000
      - name: Run release core smoke
        run: python -m deepuplift.benchmarks.release --synthetic-rows 180 --scale-rows 300 --output-dir release_runs_ci
