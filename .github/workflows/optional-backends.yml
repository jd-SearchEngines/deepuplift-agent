name: optional-backends

on:
  workflow_dispatch:

jobs:
  optional:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: econml
            extra: econml
          - name: causalml
            extra: causalml
          - name: sklift
            extra: sklift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated optional backend
        run: python -m pip install --upgrade pip setuptools wheel build && python -m pip install -e ".[${{ matrix.extra }}]" && python -m pip install pytest
      - name: Run optional smoke
        run: python scripts/run_optional_backend_smoke.py --backend ${{ matrix.name }} --output optional-${{ matrix.name }}.json
